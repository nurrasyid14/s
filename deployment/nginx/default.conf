# ==============================================================================
# SuaraLens Production Nginx Configuration
# ==============================================================================

# Pemetaan status HTTPS berdasarkan header X-Forwarded-Proto dari Cloudflare
map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Batas ukuran payload request (mendukung upload lampiran hingga 5MB + multipart overhead)
    client_max_body_size 20M;

    # Sembunyikan informasi versi Nginx
    server_tokens off;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    # Proteksi terhadap MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Proteksi Clickjacking: izinkan embedding hanya jika berasal dari origin yang sama
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Kendali pengiriman referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Batasi akses ke fitur hardware browser
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy (disesuaikan untuk API Backend & streaming attachment)
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; object-src 'none';" always;

    # --------------------------------------------------------------------------
    # Routing & FastCGI PHP-FPM
    # --------------------------------------------------------------------------
    # Seluruh request dipetakan ke berkas statis atau diteruskan ke index.php CodeIgniter
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Penanganan skrip PHP melalui FastCGI ke service backend (PHP-FPM)
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param CI_ENVIRONMENT production;

        # Penerusan Header Proxy & Cloudflare Terpercaya
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;

        # Optimasi buffer FastCGI
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 120s;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Proteksi File Sensitif & Tersembunyi
    # --------------------------------------------------------------------------
    # Blokir akses ke direktori internal CodeIgniter jika tidak sengaja terpapar
    location ~* /(app|system|writable|vendor|tests)/ {
        deny all;
        return 404;
    }

    # Blokir akses ke file tersembunyi seperti .env, .git, .htaccess
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
