      <text x="342" y="22" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#15803D" text-anchor="middle">Selesai</text>
      <text x="420" y="22" font-family="Geist Mono, monospace" font-size="9" fill="#64748B" text-anchor="end">Hari ini, 10:15</text>
      <!-- Separator -->
