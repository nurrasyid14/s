    <g transform="translate(66, 108)">
      <rect x="0" y="0" width="160" height="130" rx="14" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="14" y="22" font-family="Geist, sans-serif" font-size="10" font-weight="600" fill="#64748B">Total Aspirasi Masuk</text>
      <text x="14" y="52" font-family="Geist Mono, monospace" font-size="24" font-weight="700" fill="#0B1F3A">1.284</text>
