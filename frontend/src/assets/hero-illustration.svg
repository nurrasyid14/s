      <text x="21" y="54" font-family="Geist, sans-serif" font-size="9" font-weight="700" fill="#B45309" text-anchor="middle">#2</text>
      <text x="38" y="55" font-family="Geist, sans-serif" font-size="10" font-weight="600" fill="#0B1F3A">SL-0248 · Peningkatan Bandwidth Wi-Fi Perpustakaan</text>
      <rect x="315" y="43" width="55" height="16" rx="8" fill="#EFF6FF" />
      <text x="342" y="54" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#1D4ED8" text-anchor="middle">Diproses</text>
      <text x="420" y="54" font-family="Geist Mono, monospace" font-size="9" fill="#64748B" text-anchor="end">Hari ini, 09:30</text>
    </g>
