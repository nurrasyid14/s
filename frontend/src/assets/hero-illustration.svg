  </defs>

  <!-- Background decorative rings & network -->
  <g opacity="0.35">
    <circle cx="400" cy="300" r="260" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="400" cy="300" r="190" stroke="#60A5FA" stroke-width="1" />
    <circle cx="400" cy="300" r="110" stroke="#93C5FD" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="140" y1="300" x2="660" y2="300" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
    <line x1="400" y1="80" x2="400" y2="520" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />
  </g>

  <!-- Campus Building Backdrop (Symbol of EEPIS Institution) -->
  <g opacity="0.4" transform="translate(230, 90)">
    <polygon points="170,0 210,35 130,35" fill="#38BDF8" opacity="0.8" />
    <rect x="155" y="35" width="30" height="25" fill="#1D4ED8" />
    <rect x="60" y="60" width="220" height="85" rx="6" fill="#0B1F3A" />
    <!-- Pillars -->
    <rect x="85" y="70" width="14" height="65" rx="3" fill="#60A5FA" opacity="0.7" />
    <rect x="125" y="70" width="14" height="65" rx="3" fill="#60A5FA" opacity="0.7" />
    <rect x="165" y="70" width="14" height="65" rx="3" fill="#60A5FA" opacity="0.7" />
    <rect x="205" y="70" width="14" height="65" rx="3" fill="#60A5FA" opacity="0.7" />
    <rect x="245" y="70" width="14" height="65" rx="3" fill="#60A5FA" opacity="0.7" />
