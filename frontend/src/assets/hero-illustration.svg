      <circle cx="17" cy="52" r="9" fill="#E2E8F0" />
      <circle cx="17" cy="80" r="9" fill="#E2E8F0" />
      <circle cx="17" cy="108" r="9" fill="#E2E8F0" />
      <circle cx="17" cy="236" r="8" fill="#CBD5E1" />
