    <rect x="0" y="0" width="145" height="68" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="28" cy="34" r="16" fill="#DCFCE7" />
    <path d="M22,34 L26,38 L34,29" stroke="#15803D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="28" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#0B1F3A">SLA Tercapai</text>
    <text x="52" y="43" font-family="Geist, sans-serif" font-size="14" font-weight="800" fill="#15803D">96.4%</text>
    <text x="52" y="55" font-family="Geist, sans-serif" font-size="8" fill="#64748B">Standar &lt; 3 Hari</text>
  </g>

  <!-- Floating Badge 2: Real-time NLP Triage (Bottom Left) -->
  <g filter="url(#cardShadow)" transform="translate(45, 410)">
    <rect x="0" y="0" width="165" height="74" rx="16" fill="#0B1F3A" />
    <rect x="14" y="16" width="32" height="32" rx="8" fill="#1D4ED8" />
    <circle cx="30" cy="32" r="7" stroke="#FFFFFF" stroke-width="2" />
    <line x1="35" y1="37" x2="41" y2="43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="54" y="30" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Analisis NLP AI</text>
    <text x="54" y="44" font-family="Geist, sans-serif" font-size="9" fill="#93C5FD">Disposisi Otomatis</text>
    <text x="54" y="56" font-family="Geist Mono, monospace" font-size="8" font-weight="600" fill="#38BDF8">Akurasi 94%</text>
  </g>

  <!-- Floating Badge 3: 14 Campus Units (Bottom Right) -->
  <g filter="url(#cardShadow)" transform="translate(595, 390)">
    <rect x="0" y="0" width="155" height="70" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    <rect x="14" y="16" width="30" height="30" rx="8" fill="#F1F5F9" />
    <path d="M22,34 L29,22 L36,34 Z" fill="#1D4ED8" />
