    <circle cx="44" cy="24" r="5" fill="#F59E0B" />
    <circle cx="60" cy="24" r="5" fill="#10B981" />
    
    <!-- Header Pill Nav in Window -->
    <rect x="180" y="14" width="180" height="22" rx="11" fill="#E2E8F0" opacity="0.7" />
    <rect x="182" y="16" width="56" height="18" rx="9" fill="#0B1F3A" />
    <text x="210" y="28" font-family="Geist, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Overview</text>
    <text x="265" y="28" font-family="Geist, sans-serif" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Aktivitas</text>
    <text x="325" y="28" font-family="Geist, sans-serif" font-size="9" font-weight="500" fill="#64748B" text-anchor="middle">Disposisi</text>

