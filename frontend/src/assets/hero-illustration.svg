        <line x1="0" y1="82" x2="118" y2="82" stroke="#CBD5E1" stroke-width="1" />
      </g>
    </g>

    <!-- Bottom Mini Table Row -->
    <g transform="translate(66, 250)">
      <rect x="0" y="0" width="458" height="68" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <!-- Row 1 -->
      <rect x="12" y="10" width="18" height="18" rx="4" fill="#DBEAFE" />
      <text x="21" y="22" font-family="Geist, sans-serif" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">#1</text>
      <text x="38" y="23" font-family="Geist, sans-serif" font-size="10" font-weight="600" fill="#0B1F3A">SL-0247 · Pemeliharaan AC Lab Gedung D</text>
