    <!-- Main Content Inside Frame -->
    <!-- Welcome Text & Subtitle -->
    <text x="66" y="80" font-family="Geist, sans-serif" font-size="16" font-weight="700" fill="#0B1F3A">Dashboard SuaraLens</text>
    <text x="66" y="94" font-family="Geist, sans-serif" font-size="9" font-weight="400" fill="#64748B">Sistem aspirasi kampus terpadu dan akuntabel berbasis SLA</text>

