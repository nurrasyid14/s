    <text x="52" y="30" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#0B1F3A">14 Unit Kerja</text>
    <text x="52" y="44" font-family="Geist, sans-serif" font-size="9" fill="#64748B">Terhubung Langsung</text>
    <text x="52" y="56" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#15803D">● Semua Online</text>
  </g>
</svg>
