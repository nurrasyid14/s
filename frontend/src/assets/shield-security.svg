<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B1F3A" />
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="#F8FAFC" stroke="#E2E8F0" />

  <!-- Shield in center -->
  <g transform="translate(200, 130)" filter="url(#shieldShadow)">
    <path d="M0,-65 C45,-65 75,-45 75,-10 C75,45 25,80 0,95 C-25,80 -75,45 -75,-10 C-75,-45 -45,-65 0,-65 Z" fill="url(#shieldGrad)" />
    <!-- Inner Shield border -->
    <path d="M0,-55 C38,-55 63,-38 63,-8 C63,38 20,68 0,80 C-20,68 -63,38 -63,-8 C-63,-38 -38,-55 0,-55 Z" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
    <!-- Lock Emblem -->
    <rect x="-18" y="-5" width="36" height="28" rx="6" fill="#FFFFFF" />
    <path d="M-11,-5 L-11,-15 C-11,-21 11,-21 11,-15 L11,-5" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="0" cy="7" r="3.5" fill="#1D4ED8" />
    <path d="M0,10 L0,16" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Left Trust Badge -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="75" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="37" y="22" font-family="Geist, sans-serif" font-size="9" font-weight="700" fill="#0B1F3A" text-anchor="middle">Anonim</text>
    <text x="37" y="36" font-family="Geist, sans-serif" font-size="8" fill="#15803D" font-weight="600" text-anchor="middle">100% Aman</text>
  </g>

  <!-- Right Trust Badge -->
  <g transform="translate(280, 120)">
    <rect x="0" y="0" width="75" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="37" y="22" font-family="Geist, sans-serif" font-size="9" font-weight="700" fill="#0B1F3A" text-anchor="middle">Terenkripsi</text>
    <text x="37" y="36" font-family="Geist, sans-serif" font-size="8" fill="#1D4ED8" font-weight="600" text-anchor="middle">SHA-256</text>
  </g>

  <!-- Bottom Capsule -->
  <rect x="80" y="245" width="240" height="30" rx="15" fill="#0B1F3A" />
  <text x="200" y="264" font-family="Geist, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Perlindungan Identitas Pelapor Sivitas EEPIS</text>
</svg>
