<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="triageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0B1F3A" />
    </linearGradient>
    <filter id="glowFtr" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1D4ED8" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="400" height="300" rx="20" fill="#F8FAFC" stroke="#E2E8F0" />
  
  <!-- Central Scan Node -->
  <g transform="translate(200, 150)" filter="url(#glowFtr)">
    <circle cx="0" cy="0" r="46" fill="url(#triageGrad)" />
    <!-- Scanner Eye / Lens Symbol -->
    <circle cx="0" cy="0" r="22" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="4 2" />
    <circle cx="0" cy="0" r="10" fill="#38BDF8" />
    <!-- Radiating pulses -->
    <circle cx="0" cy="0" r="58" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6" />
    <circle cx="0" cy="0" r="72" stroke="#93C5FD" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />
  </g>

  <!-- Input Ticket Card (Left) -->
  <g transform="translate(30, 105)">
    <rect x="0" y="0" width="100" height="90" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="10" y="12" width="50" height="8" rx="4" fill="#0B1F3A" />
    <rect x="10" y="26" width="75" height="5" rx="2.5" fill="#94A3B8" />
    <rect x="10" y="36" width="60" height="5" rx="2.5" fill="#CBD5E1" />
    <rect x="10" y="46" width="70" height="5" rx="2.5" fill="#E2E8F0" />
    <rect x="10" y="64" width="40" height="14" rx="7" fill="#EFF6FF" />
    <text x="30" y="74" font-family="Geist, sans-serif" font-size="8" font-weight="600" fill="#1D4ED8" text-anchor="middle">Aduan Masuk</text>
  </g>

  <!-- Connectors -->
  <path d="M130,150 L154,150" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" />
  
  <!-- Dispatched Units Nodes (Right) -->
  <!-- Unit 1: Sarpras -->
  <g transform="translate(275, 55)">
    <path d="M-29,75 L-5,25" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="3 2" />
    <rect x="0" y="0" width="105" height="48" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" />
    <circle cx="18" cy="24" r="10" fill="#DBEAFE" />
    <text x="18" y="27" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">S</text>
    <text x="34" y="20" font-family="Geist, sans-serif" font-size="9" font-weight="700" fill="#0B1F3A">Sarpras</text>
    <text x="34" y="33" font-family="Geist, sans-serif" font-size="8" fill="#64748B">Gedung &amp; Lab</text>
  </g>

  <!-- Unit 2: IT Center -->
  <g transform="translate(285, 126)">
    <path d="M-39,24 L-5,24" stroke="#1D4ED8" stroke-width="2" />
    <rect x="0" y="0" width="105" height="48" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.5" />
    <circle cx="18" cy="24" r="10" fill="#1D4ED8" />
    <text x="18" y="27" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">IT</text>
    <text x="34" y="20" font-family="Geist, sans-serif" font-size="9" font-weight="700" fill="#0B1F3A">IT Center</text>
    <text x="34" y="33" font-family="Geist, sans-serif" font-size="8" fill="#1D4ED8" font-weight="600">Jaringan &amp; Sistem</text>
  </g>

  <!-- Unit 3: Akademik -->
  <g transform="translate(275, 198)">
    <path d="M-29,-25 L-5,25" stroke="#1D4ED8" stroke-width="1.8" stroke-dasharray="3 2" />
    <rect x="0" y="0" width="105" height="48" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" />
    <circle cx="18" cy="24" r="10" fill="#DBEAFE" />
    <text x="18" y="27" font-family="Geist, sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" text-anchor="middle">A</text>
    <text x="34" y="20" font-family="Geist, sans-serif" font-size="9" font-weight="700" fill="#0B1F3A">Akademik</text>
    <text x="34" y="33" font-family="Geist, sans-serif" font-size="8" fill="#64748B">KRS &amp; Kuliah</text>
  </g>

  <!-- Tag Pill -->
  <rect x="135" y="235" width="130" height="26" rx="13" fill="#0B1F3A" />
  <text x="200" y="252" font-family="Geist, sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">NLP Triage Otomatis 94%</text>
</svg>
